# Example private config. `make setup` copies it to config.toml (git-ignored).
# Put real names, devices and paths only in config.toml, never in this file.
# Secrets (tokens, passwords) go in .env, not here.

# Which implementation to use for each swappable part (see docs/configuration.md).
[parts]
camera = "nest"
detector = "onnx"
event_rules = "standard"
event_log = "sqlite"
presence = "off"
communications = "standard"

[paths]
# The Private Data Store on the NAS: clips, pictures and labels.
private_data_store = "/mnt/nas/cat-poop"
# One lock per user, shared by every worktree, so only one watcher runs.
# Default: $XDG_RUNTIME_DIR/catpoop-watcher.lock, else /tmp/catpoop-<uid>/watcher.lock.
# Its folder must be owned by you and not writable by others.
# lock_file = "/run/user/1000/catpoop-watcher.lock"

# Names used in Message templates.
[household]
cat = "the cat"
dog = "the dog"

[[listeners]]
name = "Partner"

[[speakers]]
name = "Living room"
kind = "log"
# urgencies = ["normal", "urgent"]  # which Urgencies this Speaker says (default: all)

# Speaker kind "google": a Google Home / Nest speaker, speech made here with Piper
# (`make setup EXTRAS=google`, see docs/watcher.md#speaker-google).
# [[speakers]]
# name = "Kitchen"
# kind = "google"
# device = "Kitchen speaker"         # the speaker's name in the Google Home app
# voice = "voices/en_US-lessac-medium.onnx"  # Piper voice; relative: inside paths.private_data_store
# serve_host = "..."                 # this server's LAN address (default: found automatically)
# serve_port = 8766                  # speakers fetch the speech from here
# volume = 0.6                       # 0.0-1.0; default: leave the speaker's volume as it is
# known_hosts = ["..."]              # speaker addresses, if finding them by name (mDNS) fails

# An Alexa device through Voice Monkey; the token is CATPOOP_VOICE_MONKEY_TOKEN in .env.
# [[speakers]]
# name = "Kitchen"
# kind = "alexa"
# device = "kitchen-echo"  # the Speaker device id in the Voice Monkey console
# voice = "Brian"          # optional Amazon Polly voice
# chime = "soundbank://soundlibrary/alarms/beeps_and_bloops/bell_02"  # optional

# Spoken text, one template per Event kind; kinds with no template are not said.
# {cat}, {dog} and event details (e.g. {guess} on visit_started) can be used.
[messages]
visit_started = "{cat} is in the litter box."
poop = "{cat} left poop in the litter box."
poop_reminder = "There is still poop in the litter box."
poop_after_quiet_hours = "There is poop in the litter box from during quiet hours."
dog_at_poop = "{dog} is at the litter box and there is poop in it."
camera_offline = "The litter box camera is offline."
login_expired = "The litter box camera needs you to log in again."

# Repeating quiet times. `allow` lists the Urgencies (info, normal, urgent) still spoken.
[[quiet_hours]]
days = ["sun", "mon", "tue", "wed", "thu"]
start = "22:00"
end = "07:00"
allow = ["urgent"]

[timers]
camera_offline_minutes = 10
poop_reminder_first_minutes = 1
poop_reminder_max_minutes = 60
poop_reminder_max_count = 6
login_expired_reminder_at = "18:00"

# Detector "onnx": a TF detector exported to ONNX (`make export-detector`).
[detector]
# The .onnx file; a relative path is inside paths.private_data_store.
model = "models/pets.onnx"
# auto (any GPU or macOS Core ML that is installed, else CPU), cpu, amd or nvidia.
runtime = "auto"
min_score = 0.5
# Model class id -> label. These are the TF model zoo COCO ids.
[detector.labels]
1 = "person"
17 = "cat"
18 = "dog"

# Cutting clips into Visits and labeling them (`make cut-visits`, see docs/visits.md).
[visits]
frame_seconds = 0.5      # time between checked and kept frames
cat_label = "cat"        # the detector label of the Cat
litter_box = [0.0, 0.0, 1.0, 1.0]  # left, top, right, bottom as fractions of the picture
end_gap_seconds = 3.0    # the Cat must be gone this long for a Visit to end
min_seconds = 2.0        # shorter Visits are dropped
padding_seconds = 1.0    # kept before and after each Visit
max_store_gb = 500       # then the oldest clips with no labeled Visit are deleted

# The Outcome model (`make train`, `make evaluate`, see docs/outcome-model.md).
[outcome]
models = "models/outcome"  # folder of the exported models, inside paths.private_data_store
runtime = "auto"           # auto, cpu, amd or nvidia, as for the detector
backbone = "mobilenet"     # mobilenet (pretrained, downloaded once) or small (from scratch)
image_size = 128           # pictures are resized to this many pixels square
epochs = 20
batch_size = 16
validation_fraction = 0.2  # share of Visits held out to measure accuracy
guess_frames_per_visit = 5 # frames from the middle of each Visit for the Outcome Guess
timezone = "UTC"           # IANA zone of the Litter Box (e.g. "Australia/Melbourne") for the time of day

# Camera "nest": a Google Nest camera through googlenestcam. Secrets are in .env.
[camera]
device = "Litter box"   # the camera's name in the Google Home app
size = 720              # picture height in pixels
retry_seconds = 30      # wait before reconnecting after the stream fails

# The live watcher (`make dev`, see docs/watcher.md).
[watcher]
check_seconds = 0.25    # time between detector runs on the newest picture
surface_check_seconds = 10  # time between Outcome model checks of the empty box (is Poop still there?)

# Event rules "standard" (see docs/watcher.md#event-rules).
[event_rules]
announce_pee = true     # announce Visits whose Outcome Guess is Pee
dog_label = "dog"       # detector labels of the Dog and of people
person_label = "person"
dog_gone_seconds = 60   # the Dog must be away this long before Dog at Poop is said again
scoop_settle_seconds = 120  # Poop still scored this soon after a person was at the box is ignored

# Event log "sqlite": a small database on the server.
[event_log]
# A relative path is inside $XDG_STATE_HOME/catpoop (else ~/.local/state/catpoop).
path = "events.sqlite"

# Communications handler "standard" (see docs/watcher.md#announcements).
[communications]
dnd_allow = ["urgent"]  # Urgencies Do Not Disturb lets through (`make dnd` can say otherwise)
repeat_seconds = 30     # the same text is not said again within this

# The Alexa skill (see docs/alexa-skill.md): "Alexa, ask litter box is there poop in the box?",
# Do Not Disturb and Pee announcements by voice. The watcher serves it; the skill ID is
# CATPOOP_ALEXA_SKILL_ID in .env. Only /alexa is answered, and only for signed requests.
[alexa_skill]
enabled = false
host = "127.0.0.1"      # the tunnel reaches the endpoint on this machine
port = 8767
tunnel = "cloudflare"   # cloudflare (Cloudflare Tunnel) or tailscale (Tailscale Funnel)
# hostname = "litter.example.com"  # Cloudflare only: the tunnel's public host name

# Options for the chosen implementation of each other part, one table per part.

# History importers (`make import-history`, see docs/history-import.md).
# Paths given on the command line are used instead of these.
[history.takeout]
paths = []  # Takeout archive parts (.zip/.tgz) or the folder they were unpacked to

[history.portability]
resources = ["nest.camera_event"]
# start_time = "2026-01-01T00:00:00Z"
# end_time = "2026-06-30T00:00:00Z"
poll_seconds = 60
max_wait_seconds = 86400

[history.folder]
paths = []  # folders of clips saved by hand from the Google Home app
