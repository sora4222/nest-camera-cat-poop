[project]
name = "nest-camera-cat-poop"
version = "0.1.0"
description = "Watch a Litter Box with a Nest camera and tell people about Visits and Poop"
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.12"
dependencies = [
    "av>=14",
    "certifi>=2024.2.2",
    "cryptography>=44",
    "googlenestcam[images]",
    "httpx>=0.28.1",
    "numpy>=2",
    "pillow>=11",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.0",
]

[project.optional-dependencies]
# ONNX Runtime for the detector: pick exactly one of cpu, amd, nvidia (see docs/adr/0002).
cpu = ["onnxruntime>=1.20"]
# AMD GPU runtime (MIGraphX) for the detector.
amd = ["onnxruntime-migraphx>=1.27"]
# NVIDIA GPU (CUDA) runtime for the detector.
nvidia = ["onnxruntime-gpu[cuda,cudnn]>=1.20"]
# TensorFlow for training and exporting to ONNX; never needed on the always-on server.
train = ["tensorflow>=2.16", "tf2onnx>=1.16"]
# Speaker kind "google": Piper speech and Google Home casting. Piper needs the CPU onnxruntime.
google = ["piper-tts==1.8.0", "pychromecast==14.0.10"]

[project.scripts]
catpoop = "catpoop.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "catpoop"

[tool.uv]
# Every onnxruntime wheel installs the same `onnxruntime` package, so only one may be used.
conflicts = [
    [{ extra = "cpu" }, { extra = "amd" }, { extra = "nvidia" }],
    [{ extra = "google" }, { extra = "amd" }],
    [{ extra = "google" }, { extra = "nvidia" }],
]

[tool.uv.sources]
googlenestcam = { git = "https://github.com/sora4222/nest-camera-access-python", rev = "9f5f0af" }

[dependency-groups]
dev = [
    "onnx>=1.17",
    "pytest>=9.1",
    "ruff==0.17.0",
    "ty==0.0.86",
]
# Jupyter for notebooks/ (`make notebook`); use with the train extra.
notebook = [
    "ipykernel==7.4.0",
    "jupyterlab==4.6.4",
    "nbconvert==7.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Agent worktrees hold other checkouts of this repo.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["D", "E", "F", "I", "UP", "RUF", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# Imported only to register the parts.
"src/catpoop/parts/__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.analysis]
# The train extra (TensorFlow) is only installed on the machine that trains.
allowed-unresolved-imports = [
    "tensorflow", "tensorflow.**", "keras", "keras.**", "tf2onnx", "tf2onnx.**",
    # The google extra (Speaker kind "google") is only installed where it is used.
    "piper", "piper.**", "pychromecast", "pychromecast.**",
]

[tool.ty.src]
# Notebooks import TensorFlow, which only the train extra installs.
exclude = [".claude", "notebooks"]
