name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make setup
      - run: make check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catpoop
          POSTGRES_PASSWORD: catpoop
          POSTGRES_DB: catpoop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catpoop" --health-interval 2s --health-retries 15
    env:
      CATPOOP_TEST_DATABASE_URL: postgresql://catpoop:catpoop@127.0.0.1:5432/catpoop
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make setup
      - run: make test

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      # HEAD is the PR merged into its base; HEAD^1 is that base, so a re-run measures the
      # same change even after the base branch moves.
      - run: uv run --no-project scripts/pr_size.py HEAD^1
